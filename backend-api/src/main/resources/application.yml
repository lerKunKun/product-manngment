spring:
  application:
    name: shopifyhub-backend
  profiles:
    active: ${APP_ENV:dev}
  servlet:
    multipart:
      # 产品图 / 文档 / 视频上传限制；env 可覆盖
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:200MB}

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

notification:
  email:
    # 默认开（生产用）。dev 没配真 SMTP 就 export NOTIFICATION_EMAIL_ENABLED=false 关掉，
    # 避免 PRODUCT_PUSH_FAIL 等失败通知反复跑去尝试连不通的 SMTP，污染日志。
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
  dingtalk:
    enabled: ${NOTIFICATION_DINGTALK_ENABLED:true}

logging:
  level:
    com.biou.shopifyhub: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
