name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0 || true   # Wave 0 占位
      - run: pnpm build

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: platform
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics ping" --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f backend-api/pom.xml verify
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          MQ_HOST: 127.0.0.1

  worker:
    name: Worker (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: asset-worker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app
      - run: pytest -q || echo 'no tests yet'   # Wave 0 占位

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 0   # Wave 0 不阻断；Wave 1 改 1

  e2e-wave4:
    name: E2E Wave 4
    needs: [backend, frontend, worker]
    runs-on: ubuntu-latest
    continue-on-error: true   # 起 backend 不稳定时不阻塞主 CI；后续稳定后改 false
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopifyhub
          MYSQL_USER: shopifyhub
          MYSQL_PASSWORD: shopifyhub_dev_pass
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics ping" --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3307 -uroot -proot && break
            sleep 2
          done

      - name: Build & start backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_PLATFORM_DB: shopifyhub
          MYSQL_USER: shopifyhub
          MYSQL_PASSWORD: shopifyhub_dev_pass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6380
          MQ_HOST: 127.0.0.1
          MQ_PORT: 5672
        run: |
          cd backend-api
          mvn -B -DskipTests -q clean package
          nohup java -jar target/*.jar > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://localhost:8080/api/health 2>/dev/null && break
            sleep 2
          done

      - name: Run e2e-wave4
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_USER: shopifyhub
          MYSQL_DB: shopifyhub
          MYSQL_PASSWORD: shopifyhub_dev_pass
        run: |
          chmod +x bin/e2e-wave4.sh
          bash bin/e2e-wave4.sh

      - name: Backend log on failure
        if: failure()
        run: tail -300 /tmp/backend.log || true
