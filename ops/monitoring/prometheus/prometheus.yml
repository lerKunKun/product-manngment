global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# W2-MON-04: alert rule files (api-health / jvm-resource / business / infra-placeholder)
rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]   # local dev (compose service)
    # 生产替换：targets: ["10.0.0.1:9100", "10.0.0.2:9100"]  # 节点 A/B WG IP，等 W1-INF 落地

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: shopifyhub-backend
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
    # 生产替换：targets: ["10.0.0.1:8080"]
