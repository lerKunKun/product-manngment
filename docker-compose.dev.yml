# 本地开发栈：MySQL 8 + Redis 8 + RabbitMQ 4 + MinIO（R2 兼容）
# 启动：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml down
# 清空：docker compose -f docker-compose.dev.yml down -v

name: shopify-hub-dev

services:
  mysql:
    image: mysql:8.0
    container_name: shopify-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: platform
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max-connections=500
      - --innodb-buffer-pool-size=512M
    ports:
      # 主机 3307 → 容器 3306，避开本机 brew services 的 mysql@8.0（默认 3306）
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ops/dev-init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: shopify-hub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # 主机 6380 → 容器 6379，避开本机 brew services 的 redis（默认 6379）
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: shopify-hub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shopify-hub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Console UI: http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 自动创建 MinIO 桶 + 设置权限（一次性 job，启动后退出）
  minio-init:
    image: minio/mc:latest
    container_name: shopify-hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/shopify-assets-dev || true;
      mc mb -p local/shopify-assets-dev-public || true;
      mc anonymous set download local/shopify-assets-dev-public;
      echo 'MinIO buckets ready.';
      "

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
