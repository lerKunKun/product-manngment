# hy.biounetwork.com — Shopify Hub (frontend + backend api) HTTPS via certbot
# 路径：/www/server/panel/vhost/nginx/hy.biounetwork.com.conf
# docker container 端口：frontend 13000 / backend 18080（均仅 127.0.0.1 监听）

# HTTP 80 - 301 → HTTPS（保留 ACME challenge 路径用于续签）
server {
    listen 80;
    server_name hy.biounetwork.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/hy;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443
server {
    listen 443 ssl;
    http2 on;
    server_name hy.biounetwork.com;

    ssl_certificate     /etc/letsencrypt/live/hy.biounetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hy.biounetwork.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/hy.biounetwork.com.log;
    error_log  /www/wwwlogs/hy.biounetwork.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/hy;
        default_type "text/plain";
        try_files $uri =404;
    }

    # SSE 端点（saga 进度 / 资产快照进度）— 必须在 /api/ 之前匹配
    location ~ ^/api/(saga|asset/snapshot)/[^/]+/events {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    # 后端 API
    location /api/ {
        proxy_pass         http://127.0.0.1:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        client_max_body_size 200m;
        proxy_request_buffering off;
    }

    # 前端静态资源（chunk / 图片 / 字体）：内容指纹文件名 → 长缓存
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 前端 Next.js standalone — HTML 不缓存（避免 prerender etag 让浏览器返 304）
    location / {
        proxy_pass         http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;

        # 覆盖 Next.js 给 prerender HTML 发的 s-maxage=31536000；同时干掉 ETag/304 路径
        proxy_hide_header  Cache-Control;
        proxy_hide_header  ETag;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
}
