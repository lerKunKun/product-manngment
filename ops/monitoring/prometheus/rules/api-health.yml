groups:
  - name: api-health
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="shopifyhub-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "shopifyhub-backend 抓取失败 1 分钟"
          description: "Prometheus job shopifyhub-backend 实例 {{ $labels.instance }} 已下线超过 1 分钟。"

      - alert: HighErrorRate5xx
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="shopifyhub-backend",status=~"5.."}[5m]))
           / sum(rate(http_server_requests_seconds_count{job="shopifyhub-backend"}[5m]))) > 0.01
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "5xx 错误率 > 1%（5 分钟均值）"
          description: "Backend 5xx 占比 {{ $value | humanizePercentage }} 持续 5 分钟，请检查日志。"

      - alert: LoginFailureSpike
        expr: |
          sum(rate(shopifyhub_auth_login_total{result="fail"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "登录失败速率异常（>30 次/分）"
          description: "{{ $value | humanize }} 次/秒。可能存在暴力破解，检查 sys_audit_log。"
