# ShopifyHub 节点 A nginx 反代
# 路径：/etc/nginx/sites-available/shopifyhub
# 启用：sudo ln -s /etc/nginx/sites-available/shopifyhub /etc/nginx/sites-enabled/
# 验证：sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare → 443 (CF Origin Cert) → backend (8080) / frontend (3000)
# 节点 A 仅监听 WireGuard 网卡 + Cloudflare IP 段；其他流量走 ufw 拦截。

# 上游：本地 backend / frontend
upstream shopifyhub_backend {
  server 127.0.0.1:8080;
  keepalive 32;
}

upstream shopifyhub_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

# HTTP → HTTPS 重定向（Cloudflare 已强制 HTTPS，但节点 A 内部仍保险一层）
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.biounetwork.com admin.biounetwork.com;

  # Cloudflare Origin Cert（15 年有效）
  ssl_certificate     /etc/ssl/cf-origin.pem;
  ssl_certificate_key /etc/ssl/cf-origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # 安全头（前端 SecurityConfig 已有 CSP，这里再补一层基础防御）
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 上传放大（与 application.yml UPLOAD_MAX_REQUEST_SIZE 对齐 200MB；视频改 1GB env 也可）
  client_max_body_size 200m;
  proxy_read_timeout 120s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 120s;

  # 后端 API
  location /api/      { proxy_pass http://shopifyhub_backend; include /etc/nginx/snippets/proxy-headers.conf; }
  location /oauth/    { proxy_pass http://shopifyhub_backend; include /etc/nginx/snippets/proxy-headers.conf; }
  location /webhook/  { proxy_pass http://shopifyhub_backend; include /etc/nginx/snippets/proxy-headers.conf; }
  location /actuator/ {
    # actuator 仅 WG 网段访问；外部 403
    allow 10.88.0.0/24;
    deny all;
    proxy_pass http://shopifyhub_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
  }

  # SSE：禁用 buffer 让事件实时推
  location ~ ^/api/(asset/snapshot|saga|task)/[^/]+/events$ {
    proxy_pass http://shopifyhub_backend;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    include /etc/nginx/snippets/proxy-headers.conf;
  }

  # 前端 Next.js
  location / {
    proxy_pass http://shopifyhub_frontend;
    include /etc/nginx/snippets/proxy-headers.conf;
  }
}
